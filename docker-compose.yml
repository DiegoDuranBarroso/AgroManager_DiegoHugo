version: '3.8'
services:
  mysql:
    image: mysql:8.4
    container_name: agromanager-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agromanager
      MYSQL_USER: agromanager
      MYSQL_PASSWORD: agromanager
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: