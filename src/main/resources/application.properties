spring.application.name=AgroManager_DiegoHugo

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/agromanager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=agromanager
spring.datasource.password=agromanager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Permitir que se ejecute data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging SQL
logging.level.org.hibernate.SQL=debug

