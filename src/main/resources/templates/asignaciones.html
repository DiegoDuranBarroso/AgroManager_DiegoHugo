<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignaciones de Empleados a Fincas</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">


    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">AgroManager - 👔Gerente</a>

        <span class="navbar-text text-white"
              th:text="'👤 ' + ${gerente.nombre}">
    👤 Nombre gerente
</span>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Asignaciones</h2>
        <a th:href="@{/asignaciones/nueva}" class="btn btn-success">
            + Nueva Asignación
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <table class="table table-striped mb-0">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Empleado</th>
                    <th>Finca</th>
                    <th>Fecha inicio</th>
                    <th>Fecha fin</th>
                    <th>Activa</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="asig : ${asignaciones}">
                    <td th:text="${asig.id}"></td>
                    <td th:text="${asig.empleado != null ? asig.empleado.nombre : '—'}"></td>
                    <td th:text="${asig.finca != null ? asig.finca.nombre : '—'}"></td>
                    <td th:text="${asig.fechaInicio}"></td>
                    <td th:text="${asig.fechaFin != null ? asig.fechaFin : '—'}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${asig.activa} ? 'bg-success' : 'bg-secondary'"
                              th:text="${asig.activa} ? 'Sí' : 'No'">
                        </span>
                    </td>
                    <td>
                        <!-- Cerrar asignación solo si está activa -->
                        <form th:if="${asig.activa}"
                              th:action="@{|/asignaciones/${asig.id}/cerrar|}"
                              method="post" class="d-inline">
                            <button class="btn btn-sm btn-warning"
                                    onclick="return confirm('¿Cerrar esta asignación?')">
                                Cerrar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/home}" class="btn btn-secondary">Volver al inicio</a>
    </div>

</div>

</body>
</html>
