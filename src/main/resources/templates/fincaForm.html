<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Finca</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">AgroManager</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-4">Editar estado de la finca</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- OJO: ya no usamos th:object, solo enviamos el estado -->
            <form th:action="@{|/fincas/${finca.id}|}"
                  method="post">

                <!-- Nombre (solo lectura, NO editable) -->
                <div class="mb-3">
                    <label class="form-label">Nombre de la finca</label>
                    <input type="text"
                           class="form-control"
                           th:value="${finca.nombre}"
                           readonly>
                </div>

                <!-- Gerente (solo lectura, como ya tenías) -->
                <div class="mb-3">
                    <label class="form-label">Gerente</label>
                    <input type="text" class="form-control"
                           th:value="${finca.gerente != null ? finca.gerente.nombre : 'Sin gerente asignado'}"
                           readonly>
                </div>

                <!-- Estado (ÚNICO campo editable) -->
                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select class="form-select" name="estado">
                        <option th:each="est : ${estados}"
                                th:value="${est}"
                                th:selected="${est} == ${finca.estado}"
                                th:text="${est}">
                        </option>
                    </select>
                </div>

                <!-- BOTONES -->
                <div class="mt-4">
                    <button class="btn btn-success" type="submit">Guardar cambios</button>
                    <a th:href="@{/fincas/}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
