<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Fichaje</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">AgroManager</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-4">Nuevo Fichaje</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- FORMULARIO NUEVO FICHAJE -->
            <!-- OJO: coincide con @PostMapping("/") del FichajeController -->
            <form th:action="@{/fichajes/}" method="post">

                <!-- EMPLEADO -->
                <div class="mb-3">
                    <label class="form-label">Empleado</label>
                    <select class="form-select" name="empleadoId" required>
                        <option value="">-- Selecciona un empleado --</option>
                        <option th:each="emp : ${empleados}"
                                th:value="${emp.id}"
                                th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                        </option>
                    </select>
                </div>

                <!-- FINCA -->
                <div class="mb-3">
                    <label class="form-label">Finca</label>
                    <select class="form-select" name="fincaId" required>
                        <option value="">-- Selecciona una finca --</option>
                        <option th:each="f : ${fincas}"
                                th:value="${f.id}"
                                th:text="${f.nombre}">
                        </option>
                    </select>
                </div>

                <!-- BOTONES -->
                <div class="mt-4">
                    <button class="btn btn-success" type="submit">Guardar fichaje</button>
                    <a th:href="@{/fichajes/}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
