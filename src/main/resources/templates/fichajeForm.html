<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Fichaje</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/encabezado.css}">
    <link rel="stylesheet" th:href="@{/css/fondos2.css}">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
</head>

<body>

<!-- NAVBAR -->
<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid d-flex justify-content-between align-items-center">

        <!-- Logo + texto EMPLEADO -->
        <a class="navbar-brand d-flex align-items-center brand-box"
           th:href="@{/home}">
            <img th:src="@{/img/favicon.png}" alt="Logo" class="brand-logo">
            <span class="brand-text">AGROMANAGER - 🦺 Empleado</span>
        </a>

        <!-- CHIP INFORMATIVO DE PERFIL (solo empleado, sin enlace) -->
        <div class="d-flex align-items-center profile-chip">

            <!-- Nombre del empleado -->
            <span class="profile-name me-3"
                  th:text="${empleado.nombre}">
                Nombre empleado
            </span>

            <!-- Avatar -->
            <div class="profile-avatar">

                <!-- Foto si existe -->
                <img th:if="${empleado.usuario.fotoPerfil != null}"
                     th:src="@{|/uploads/${empleado.usuario.fotoPerfil}|}"
                     alt="Foto perfil">

                <!-- Icono si NO hay foto -->
                <i th:if="${empleado.usuario.fotoPerfil == null}"
                   class="bi bi-person-fill"></i>

            </div>
        </div>

    </div>
</nav>


<!-- ==== FONDO APLICADO ==== -->
<div class="home-wrapper">
    <div class="home-content container">

        <h2 class="fw-bold mb-3">Nuevo Fichaje</h2>

        <div class="card shadow-sm">
            <div class="card-body">

                <form th:action="@{/fichajes/nuevo}" method="post">

                    <!-- Info del empleado -->
                    <div class="mb-3">
                        <label class="form-label">Empleado</label>
                        <div class="alert alert-secondary mb-1" role="alert">
                            <strong th:text="${empleado.nombre}">Nombre empleado</strong>
                            <span th:text="' — DNI: ' + ${empleado.dni}"> — DNI: XXXXXXXXX</span>
                        </div>
                        <input type="hidden" name="empleadoId" th:value="${empleado.id}">
                    </div>

                    <!-- Finca -->
                    <div class="mb-3">
                        <label class="form-label">Finca</label>
                        <select class="form-select" name="fincaId" required>
                            <option value="">-- Selecciona una finca --</option>
                            <option th:each="f : ${fincas}"
                                    th:value="${f.id}"
                                    th:text="${f.nombre}">
                            </option>
                        </select>
                    </div>

                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-success">
                            Guardar fichaje de inicio
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{|/fichajes/?empleadoId=${empleado.id}|}"
               class="btn btn-outline-secondary">
                Volver a mis fichajes
            </a>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer style="background-color: #1e1e1e; padding: 25px 0;">
    <div class="container text-center text-white">

        <p class="mb-2">
            © 2025 <strong>AgroManager</strong> — Todos los derechos reservados.
        </p>

        <p class="mb-3">
            Contacto:
            <a href="mailto:contacto@agromanager.com"
               style="color: #4caf50; text-decoration: none;">
                contacto@agromanager.com
            </a>
        </p>

        <div class="mb-3">
            <a href="https://facebook.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://twitter.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-twitter-x" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://linkedin.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-linkedin" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://github.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-github" style="font-size: 1.5rem;"></i>
            </a>
        </div>

        <p class="mb-0 text-secondary">
            APP creada por <strong>Diego Durán Barroso</strong> y
            <strong>Hugo Sánchez de la Roda Rivera</strong>.
        </p>

    </div>
</footer>

</body>
</html>
