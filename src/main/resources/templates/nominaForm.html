<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generar Nómina</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">AgroManager</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-4">Generar Nómina</h2>
    <div th:if="${errorNomina}" class="alert alert-danger" role="alert"
         th:text="${errorNomina}">
    </div>


    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/nominas/generar}" method="post">

                <!-- EMPLEADO -->
                <div class="mb-3">
                    <label class="form-label">Empleado</label>
                    <select class="form-select" name="empleadoId" required>
                        <option th:value="''"
                                th:if="${empleadoIdSeleccionado == null}"
                                disabled selected>-- Selecciona un empleado --</option>

                        <option th:each="emp : ${empleados}"
                                th:value="${emp.id}"
                                th:selected="${empleadoIdSeleccionado != null and empleadoIdSeleccionado == emp.id}"
                                th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                        </option>
                    </select>
                </div>

                <!-- PERIODO INICIO -->
                <div class="mb-3">
                    <label class="form-label">Periodo - Inicio</label>
                    <input type="date" class="form-control" name="periodoInicio" required>
                </div>

                <!-- PERIODO FIN -->
                <div class="mb-3">
                    <label class="form-label">Periodo - Fin</label>
                    <input type="date" class="form-control" name="periodoFin" required>
                </div>

                <!-- ESTADO -->
                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select class="form-select" name="estado">
                        <option value="BORRADOR" selected>BORRADOR</option>
                        <option value="CONFIRMADA">CONFIRMADA</option>
                        <option value="CANCELADA">CANCELADA</option>
                    </select>
                    <small class="text-muted">
                        Si dejas BORRADOR, la nómina se genera pero aún no se considera definitiva.
                    </small>
                </div>

                <!-- BOTONES -->
                <div class="mt-4">
                    <button type="submit" class="btn btn-success">Generar nómina</button>
                    <a th:href="@{/nominas/}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
