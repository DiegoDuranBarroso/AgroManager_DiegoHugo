<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Fincas</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">


    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">AgroManager  - 👔Gerente</a>
        <span class="navbar-text text-white"
              th:text="'👤 ' + ${gerente.nombre}">
    👤 Nombre gerente
</span>

    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Fincas</h2>
        <!-- Botón de nueva finca en futuras ampliaciones -->
        <!-- <a th:href="@{/fincas/nueva}" class="btn btn-success">+ Nueva Finca</a> -->
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <table class="table table-striped mb-0">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Gerente</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="finca : ${fincas}">
                    <td th:text="${finca.id}"></td>
                    <td th:text="${finca.nombre}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${
                                  finca.estado.name() == 'SEMBRADA'
                                      ? 'bg-primary'
                                      : (
                                          finca.estado.name() == 'MANTENIMIENTO'
                                              ? 'bg-warning text-dark'
                                              : (
                                                  finca.estado.name() == 'LISTA_COSECHA'
                                                      ? 'bg-success'
                                                      : 'bg-secondary'
                                                )
                                        )
                              }"
                              th:text="${finca.estado}">
                        </span>
                    </td>

                    <td th:text="${finca.gerente != null ? finca.gerente.nombre : '—'}"></td>

                    <td>
                        <a class="btn btn-sm btn-primary"
                           th:href="@{|/fincas/${finca.id}/editar|}">
                            Editar
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/home}" class="btn btn-secondary">Volver al inicio</a>
    </div>

</div>

<footer style="background-color: #1e1e1e; padding: 25px 0; margin-top: 40px;">
    <div class="container text-center text-white">

        <p class="mb-2">
            © 2025 <strong>AgroManager</strong> — Todos los derechos reservados.
        </p>

        <p class="mb-3">
            Contacto:
            <a href="mailto:contacto@agromanager.com"
               style="color: #4caf50; text-decoration: none;">
                contacto@agromanager.com
            </a>
        </p>

        <div class="mb-3">
            <a href="https://facebook.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://twitter.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-twitter-x" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://linkedin.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-linkedin" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://github.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-github" style="font-size: 1.5rem;"></i>
            </a>
        </div>

        <p class="mb-0 text-secondary">
            APP creada por <strong>Diego Durán Barroso</strong>y <strong>Hugo Sánchez de la Roda Rivera</strong>.
        </p>

    </div>
</footer>

</body>
</html>
