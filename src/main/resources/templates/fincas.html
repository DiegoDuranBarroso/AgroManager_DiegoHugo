<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Fincas</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">AgroManager</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Fincas</h2>
        <!-- Si en el futuro añades crear finca, aquí pondrías el botón -->
        <!-- <a th:href="@{/fincas/nueva}" class="btn btn-success">+ Nueva Finca</a> -->
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <table class="table table-striped mb-0">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Gerente</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="finca : ${fincas}">
                    <td th:text="${finca.id}"></td>
                    <td th:text="${finca.nombre}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${finca.estado.name() == 'SEMBRADA'} ? 'bg-primary' :
                                              ${finca.estado.name() == 'MANTENIMIENTO'} ? 'bg-warning text-dark' :
                                              ${finca.estado.name() == 'LISTA_COSECHA'} ? 'bg-success' :
                                              'bg-secondary'"
                              th:text="${finca.estado}">
                        </span>
                    </td>
                    <td th:text="${finca.gerente != null ? finca.gerente.nombre : '—'}"></td>
                    <td>
                        <a class="btn btn-sm btn-primary"
                           th:href="@{|/fincas/${finca.id}/editar|}">
                            Editar
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>
    </div>

</div>

</body>
</html>
