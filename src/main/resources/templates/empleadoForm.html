<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Empleado</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">AgroManager</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-4" th:text="${empleado.id == null} ? 'Nuevo Empleado' : 'Editar Empleado'"></h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- FORMULARIO -->
            <form th:action="${empleado.id == null} ? @{/empleados/} : @{|/empleados/${empleado.id}|}"
                  th:object="${empleado}" method="post">

                <!-- DNI -->
                <div class="mb-3">
                    <label class="form-label">DNI</label>
                    <input type="text" class="form-control" th:field="*{dni}" required>
                </div>

                <!-- Nombre -->
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <!-- Activo -->
                <div class="mb-3">
                    <label class="form-label">Activo</label>
                    <select class="form-select" th:field="*{activo}">
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select>
                </div>

                <!-- Usuario asociado -->
                <div class="mb-3">
                    <label class="form-label">ID Usuario asociado</label>
                    <input type="number" class="form-control"
                           th:value="${empleado.usuario != null ? empleado.usuario.id : ''}"
                           name="usuarioId" required>
                    <small class="text-muted">Debe existir ya un usuario creado.</small>
                </div>

                <!-- BOTONES -->
                <div class="mt-4">
                    <button class="btn btn-success">Guardar</button>
                    <a th:href="@{/empleados/}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
