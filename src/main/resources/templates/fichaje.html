<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis fichajes - AgroManager</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">AgroManager - 🦺Empleado</a>

        <span class="navbar-text text-white"
              th:text="'👤 ' + ${empleado.nombre}">
    👤 Nombre empleado
</span>

    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">
            Mis fichajes
        </h2>

        <!-- Botón para registrar un nuevo fichaje de inicio -->
        <a class="btn btn-success"
           th:href="@{|/fichajes/nuevo?empleadoId=${empleado.id}|}">
            + Nuevo fichaje de inicio
        </a>
    </div>

    <!-- TABLA DE FICHAJES (solo del empleado actual) -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Finca</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fic : ${fichajes}">
                    <td th:text="${fic.id}"></td>

                    <td th:text="${fic.finca != null ? fic.finca.nombre : '—'}"></td>

                    <td th:text="${fic.inicio != null ? #temporals.format(fic.inicio, 'yyyy-MM-dd HH:mm') : '—'}"></td>
                    <td th:text="${fic.fin != null ? #temporals.format(fic.fin, 'yyyy-MM-dd HH:mm') : '—'}"></td>

                    <td th:text="${fic.estado}"></td>

                    <td>
                        <!-- Marcar salida si aún está abierto -->
                        <form th:if="${fic.fin == null}"
                              th:action="@{|/fichajes/fin?empleadoId=${empleado.id}|}"
                              method="post"
                              class="d-inline">
                            <button class="btn btn-sm btn-primary">
                                Marcar salida
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/home}" class="btn btn-secondary">
            Volver al panel
        </a>
    </div>

</div>

<footer style="background-color: #1e1e1e; padding: 25px 0; margin-top: 40px;">
    <div class="container text-center text-white">

        <p class="mb-2">
            © 2025 <strong>AgroManager</strong> — Todos los derechos reservados.
        </p>

        <p class="mb-3">
            Contacto:
            <a href="mailto:contacto@agromanager.com"
               style="color: #4caf50; text-decoration: none;">
                contacto@agromanager.com
            </a>
        </p>

        <div class="mb-3">
            <a href="https://facebook.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://twitter.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-twitter-x" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://linkedin.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-linkedin" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://github.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-github" style="font-size: 1.5rem;"></i>
            </a>
        </div>

        <p class="mb-0 text-secondary">
            APP creada por <strong>Diego Durán Barroso</strong>y <strong>Hugo Sánchez de la Roda Rivera</strong>.
        </p>

    </div>
</footer>

</body>
</html>
