<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Nóminas</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">AgroManager</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Nóminas</h2>
        <a th:href="@{/nominas/generar}" class="btn btn-success">
            + Generar nómina
        </a>
    </div>

    <!-- FILTRO POR EMPLEADO -->
    <form class="row g-2 mb-4" th:action="@{/nominas/}" method="get">
        <div class="col-md-4">
            <label class="form-label">Empleado</label>
            <select class="form-select" name="empleadoId">
                <!-- opción “todos” -->
                <option value="">-- Todos --</option>

                <option th:each="emp : ${empleados}"
                        th:value="${emp.id}"
                        th:selected="${empleadoSeleccionado != null and empleadoSeleccionado == emp.id}"
                        th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                </option>
            </select>
        </div>
        <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-outline-success me-2">Filtrar</button>
            <a th:href="@{/nominas/}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </form>
    <div th:if="${mensajeNomina}" class="alert alert-success mb-3" role="alert"
         th:text="${mensajeNomina}">
    </div>


    <!-- TABLA DE NOMINAS -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Empleado</th>
                    <th>Periodo</th>
                    <th>Total bruto</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="nomina : ${nominas}">
                    <td th:text="${nomina.id}"></td>
                    <td th:text="${nomina.empleado != null ? nomina.empleado.nombre : '—'}"></td>
                    <td>
                        <span th:text="${nomina.periodoInicio}"></span>
                        &nbsp;-&nbsp;
                        <span th:text="${nomina.periodoFin}"></span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(nomina.totalBruto, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${nomina.estado == 'BORRADOR'} ? ' bg-warning text-dark' :
                                              (nomina.estado == 'CONFIRMADA' ? ' bg-success' : ' bg-secondary')"
                              th:text="${nomina.estado}">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>
    </div>

</div>

</body>
</html>
