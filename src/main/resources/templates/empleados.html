<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleados</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/encabezado.css}">
    <link rel="stylesheet" th:href="@{/css/fondos2.css}">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid d-flex justify-content-between align-items-center">

        <!-- IZQUIERDA: logo + texto -->
        <a class="navbar-brand d-flex align-items-center brand-box"
           th:href="@{/home}">
            <img th:src="@{/img/favicon.png}" alt="Logo" class="brand-logo">
            <span class="brand-text">AGROMANAGER - 👔 Gerente</span>
        </a>

        <!-- DERECHA: chip de perfil SOLO INFORMATIVO (sin enlace) -->
        <div class="d-flex align-items-center profile-chip">

            <span class="profile-name me-3"
                  th:text="${gerente.nombre}">
                Nombre gerente
            </span>

            <div class="profile-avatar">
                <!-- Si el usuario tiene foto de perfil -->
                <img th:if="${gerente.usuario != null and gerente.usuario.fotoPerfil != null}"
                     th:src="@{|/uploads/${gerente.usuario.fotoPerfil}|}"
                     alt="Foto perfil">

                <!-- Si NO tiene foto, icono por defecto -->
                <i th:if="${gerente.usuario == null or gerente.usuario.fotoPerfil == null}"
                   class="bi bi-person-fill"></i>
            </div>
        </div>

    </div>
</nav>


<!-- === FONDO GLOBAL (fondos2.css) === -->
<div class="home-wrapper">
    <div class="home-content container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold">Empleados</h2>
            <a th:href="@{/empleados/nuevo}" class="btn btn-success">+ Nuevo Empleado</a>
        </div>

        <!-- FILTRO -->
        <form class="row g-2 mb-4" th:action="@{/empleados/}" method="get">
            <div class="col-md-4">
                <label class="form-label">Empleado</label>
                <select class="form-select" name="empleadoId">
                    <option value="">-- Todos --</option>
                    <option th:each="emp : ${empleados}"
                            th:value="${emp.id}"
                            th:selected="${empleadoSeleccionado != null and empleadoSeleccionado == emp.id}"
                            th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                    </option>
                </select>
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <button type="submit" class="btn btn-outline-success me-2">Filtrar</button>
                <a th:href="@{/empleados/}" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </form>

        <div th:if="${mensajeNomina}" class="alert alert-success mb-3" role="alert"
             th:text="${mensajeNomina}">
        </div>

        <!-- TABLA -->
        <div class="card shadow-sm">
            <div class="card-body p-0">

                <table class="table table-striped mb-0 align-middle">
                    <thead class="table-success">
                    <tr>
                        <th style="width: 70px;">Foto</th>
                        <th>DNI</th>
                        <th>Nombre</th>
                        <th>Activo</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="empleado : ${empleados}">
                        <!-- FOTO PERFIL -->
                        <td class="text-center">
                            <!-- Si tiene usuario con foto -->
                            <img th:if="${empleado.usuario != null and empleado.usuario.fotoPerfil != null}"
                                 th:src="@{|/uploads/${empleado.usuario.fotoPerfil}|}"
                                 alt="Foto"
                                 class="rounded-circle"
                                 style="width: 42px; height: 42px; object-fit: cover;">
                            <!-- Si no tiene, icono por defecto -->
                            <div th:if="${empleado.usuario == null or empleado.usuario.fotoPerfil == null}"
                                 class="d-inline-flex justify-content-center align-items-center rounded-circle bg-light"
                                 style="width: 42px; height: 42px;">
                                <i class="bi bi-person-fill text-secondary" style="font-size: 1.4rem;"></i>
                            </div>
                        </td>

                        <td th:text="${empleado.dni}"></td>
                        <td th:text="${empleado.nombre}"></td>

                        <td>
                            <span th:text="${empleado.activo} ? 'Sí' : 'No'"
                                  th:classappend="${empleado.activo} ? ' text-success' : ' text-danger'">
                            </span>
                        </td>

                        <td>
                            <a class="btn btn-sm btn-primary"
                               th:href="@{|/empleados/${empleado.id}/editar|}">
                                Editar
                            </a>

                            <form th:action="@{|/empleados/${empleado.id}/eliminar|}"
                                  method="post"
                                  class="d-inline">
                                <button class="btn btn-sm btn-danger"
                                        onclick="return confirm('¿Seguro que quieres eliminar este empleado?')">
                                    Eliminar
                                </button>
                            </form>

                        </td>
                    </tr>
                    </tbody>

                </table>

            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/home}" class="btn btn-secondary">Volver al inicio</a>
        </div>

    </div>
</div>


<!-- FOOTER -->
<footer style="background-color: #1e1e1e; padding: 25px 0;">
    <div class="container text-center text-white">

        <p class="mb-2">
            © 2025 <strong>AgroManager</strong> — Todos los derechos reservados.
        </p>

        <p class="mb-3">
            Contacto:
            <a href="mailto:contacto@agromanager.com"
               style="color: #4caf50; text-decoration: none;">
                contacto@agromanager.com
            </a>
        </p>

        <div class="mb-3">
            <a href="https://facebook.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://twitter.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-twitter-x" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://linkedin.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-linkedin" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://github.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-github" style="font-size: 1.5rem;"></i>
            </a>
        </div>

        <p class="mb-0 text-secondary">
            APP creada por <strong>Diego Durán Barroso</strong> y <strong>Hugo Sánchez de la Roda Rivera</strong>.
        </p>

    </div>
</footer>

</body>
</html>
