<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Finca</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/encabezado.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center brand-box"
           th:href="@{/home}">
            <img th:src="@{/img/favicon.png}" alt="Logo" class="brand-logo">
            <span class="brand-text">AGROMANAGER - 👔 Gerente</span>
        </a>

        <span class="navbar-text text-white"
              th:text="'👤 ' + ${gerente.nombre}">
            👤 Nombre gerente
        </span>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-4">Crear nueva finca</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/fincas/guardar}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nombre de la finca</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estado inicial</label>
                    <select class="form-select" name="estado" required>
                        <option th:each="est : ${estados}"
                                th:value="${est}"
                                th:text="${est}">
                        </option>
                    </select>
                </div>

                <div class="mt-4">
                    <button class="btn btn-success" type="submit">Guardar finca</button>
                    <a th:href="@{/fincas/}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</div>

<footer style="background-color: #1e1e1e; padding: 25px 0; margin-top: 40px;">
    <div class="container text-center text-white">
        <p class="mb-2">
            © 2025 <strong>AgroManager</strong> — Todos los derechos reservados.
        </p>
        <p class="mb-3">
            Contacto:
            <a href="mailto:contacto@agromanager.com"
               style="color: #4caf50; text-decoration: none;">
                contacto@agromanager.com
            </a>
        </p>
        <p class="mb-0 text-secondary">
            APP creada por <strong>Diego Durán Barroso</strong> y <strong>Hugo Sánchez de la Roda Rivera</strong>.
        </p>
    </div>
</footer>

</body>
</html>
