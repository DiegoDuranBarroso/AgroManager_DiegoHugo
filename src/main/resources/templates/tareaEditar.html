<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Tarea</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/encabezado.css}">
    <link rel="stylesheet" th:href="@{/css/fondos2.css}">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
</head>

<body>

<!-- NAVBAR (Gerente) -->
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid d-flex justify-content-between align-items-center">

        <a class="navbar-brand d-flex align-items-center brand-box"
           th:href="@{/home}">
            <img th:src="@{/img/favicon.png}" alt="Logo" class="brand-logo">
            <span class="brand-text">AGROMANAGER - 👔 Gerente</span>
        </a>

        <span class="navbar-text text-white"
              th:text="'👤 ' + ${gerente.nombre}">
            👤 Nombre gerente
        </span>

    </div>
</nav>

<!-- === FONDO GLOBAL === -->
<div class="home-wrapper">
    <div class="home-content container">

        <h2 class="fw-bold mb-3">Editar tarea</h2>

        <div class="card shadow-sm">
            <div class="card-body">

                <!--
                    Se espera que el modelo traiga:
                    - tarea        (Tarea a editar)
                    - empleados    (lista Empleado)
                    - fincas       (lista Finca)
                -->
                <form th:action="@{|/tareas/${tarea.id}|}"
                      method="post"
                      class="row g-3">

                    <!-- EMPLEADO -->
                    <div class="col-md-6">
                        <label class="form-label">Empleado</label>
                        <select class="form-select" name="empleadoId" required>
                            <option value="">-- Selecciona empleado --</option>

                            <option th:each="emp : ${empleados}"
                                    th:value="${emp.id}"
                                    th:selected="${tarea.empleado != null and tarea.empleado.id == emp.id}"
                                    th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                            </option>
                        </select>
                    </div>

                    <!-- FINCA -->
                    <div class="col-md-6">
                        <label class="form-label">Finca</label>
                        <select class="form-select" name="fincaId" required>
                            <option value="">-- Selecciona finca --</option>

                            <option th:each="f : ${fincas}"
                                    th:value="${f.id}"
                                    th:selected="${tarea.finca != null and tarea.finca.id == f.id}"
                                    th:text="${f.nombre}">
                            </option>
                        </select>
                    </div>

                    <!-- FECHA -->
                    <div class="col-md-4">
                        <label class="form-label">Fecha</label>
                        <input type="date"
                               class="form-control"
                               name="fecha"
                               th:value="${tarea.fecha}">
                    </div>

                    <!-- TIPO -->
                    <div class="col-md-4">
                        <label class="form-label">Tipo de tarea</label>
                        <input type="text"
                               class="form-control"
                               name="tipo"
                               th:value="${tarea.tipo}"
                               required>
                    </div>

                    <!-- HORAS -->
                    <div class="col-md-4">
                        <label class="form-label">Horas trabajadas</label>
                        <input type="number"
                               class="form-control"
                               name="horas"
                               min="0.25"
                               step="0.25"
                               th:value="${tarea.horas}"
                               required>
                    </div>

                    <!-- BOTONES -->
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-success">Guardar cambios</button>
                        <a th:href="@{/tareas/}" class="btn btn-secondary">Cancelar</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

<footer style="background-color: #1e1e1e; padding: 25px 0;">
    <div class="container text-center text-white">

</body>
</html>
