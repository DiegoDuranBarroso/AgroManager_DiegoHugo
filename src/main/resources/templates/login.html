<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - AgroManager</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <!-- Si hay sesión, /home te lleva al panel según rol, si no, vuelve al menú -->
        <a class="navbar-brand" th:href="@{/home}">AgroManager</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="mb-3 text-center">Iniciar sesión</h3>

                    <!-- Mensaje de error -->
                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/login}" method="post">
                        <!-- Selector de rol -->
                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select class="form-select" name="rol" required>
                                <option value="GERENTE"
                                        th:selected="${rolSeleccionado == 'GERENTE'}">
                                    Gerente
                                </option>
                                <option value="EMPLEADO"
                                        th:selected="${rolSeleccionado == 'EMPLEADO'}">
                                    Empleado
                                </option>
                            </select>
                        </div>

                        <!-- Usuario -->
                        <div class="mb-3">
                            <label class="form-label">Nombre de usuario</label>
                            <input type="text"
                                   class="form-control"
                                   name="username"
                                   required>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   required>
                        </div>

                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-success">Entrar</button>
                        </div>

                        <div class="mt-3 text-center">
                            <a th:href="@{/registro/gerente}">¿Eres nuevo? Regístrate como gerente</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- (Opcional) Bootstrap JS si en algún momento usas modales/toasts en esta vista -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
