<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgroManager - Inicio Empleado</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body { background-color: #f5f5f5; }
        .card-hover:hover {
            transform: scale(1.02);
            transition: 0.2s ease-in-out;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">AgroManager - 🦺Empleado</a>

        <span class="navbar-text text-white"
              th:text="'👤 ' + ${empleado.nombre}">
    👤 Nombre empleado
</span>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="fw-bold mb-2">Panel del empleado</h2>
    <p class="text-muted">
        Desde aquí puedes registrar tus fichajes y ver tus tareas.
    </p>

    <div class="row g-4">

        <!-- FICHAJES -->
        <div class="col-md-6">
            <div class="card shadow-sm card-hover">
                <div class="card-body text-center">
                    <h5>Fichajes</h5>
                    <p class="text-muted">Registrar fichaje de inicio y fin</p>

                    <!-- Ver listados de mis fichajes -->
                    <a class="btn btn-outline-success mb-2"
                       th:href="@{|/fichajes/?empleadoId=${empleado.id}&modo=EMPLEADO|}">
                        Ver mis fichajes
                    </a>

                    <!-- Registrar inicio -->
                    <a class="btn btn-success"
                       th:href="@{|/fichajes/nuevo?empleadoId=${empleado.id}|}">
                        Registrar fichaje de inicio
                    </a>
                </div>
            </div>
        </div>

        <!-- TAREAS (solo ver) -->
        <div class="col-md-6">
            <div class="card shadow-sm card-hover">
                <div class="card-body text-center">
                    <h5>Tareas</h5>
                    <p class="text-muted">Consulta tus tareas realizadas</p>

                    <!-- Ver solo mis tareas -->
                    <a class="btn btn-outline-success mb-2"
                       th:href="@{|/tareas/?empleadoId=${empleado.id}&modo=EMPLEADO|}">
                        Ver mis tareas
                    </a>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-4">
        <a th:href="@{/logout}" class="btn btn-danger">Cerrar sesión</a>
    </div>
</div>

</body>
</html>
