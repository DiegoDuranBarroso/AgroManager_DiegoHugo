<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Contrato</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">


    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">AgroManager - 👔Gerente</a>

        <span class="navbar-text text-white"
              th:text="'👤 ' + ${gerente.nombre}">
    👤 Nombre gerente
</span>

    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-3">Nuevo Contrato</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- IMPORTANTE: coincide con @PostMapping("/guardar") -->
            <form th:action="@{/contratos/guardar}"
                  method="post"
                  class="row g-3">

                <!-- EMPLEADO -->
                <div class="col-md-6">
                    <label class="form-label">Empleado</label>
                    <select class="form-select" name="empleadoId" required>
                        <option value="">-- Selecciona empleado --</option>
                        <option th:each="emp : ${empleados}"
                                th:value="${emp.id}"
                                th:selected="${empleadoIdSeleccionado != null and empleadoIdSeleccionado == emp.id}"
                                th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                        </option>
                    </select>
                </div>

                <!-- TIPO DE CONTRATO -->
                <div class="col-md-6">
                    <label class="form-label">Tipo de contrato</label>
                    <select class="form-select" name="tipo" required>
                        <option value="">-- Selecciona tipo --</option>
                        <option th:each="t : ${tiposContrato}"
                                th:value="${t}"
                                th:text="${t}">
                        </option>
                    </select>
                </div>

                <!-- FECHA INICIO -->
                <div class="col-md-4">
                    <label class="form-label">Fecha inicio</label>
                    <input type="date"
                           class="form-control"
                           name="fechaInicio"
                           required>
                </div>

                <!-- FECHA FIN (opcional) -->
                <div class="col-md-4">
                    <label class="form-label">Fecha fin (opcional)</label>
                    <input type="date"
                           class="form-control"
                           name="fechaFin">
                </div>

                <!-- SALARIO BASE -->
                <div class="col-md-4">
                    <label class="form-label">Salario base</label>
                    <input type="number"
                           class="form-control"
                           name="salarioBase"
                           step="0.01"
                           min="0"
                           required>
                </div>

                <!-- TARIFA HORA -->
                <div class="col-md-4">
                    <label class="form-label">Tarifa hora</label>
                    <input type="number"
                           class="form-control"
                           name="tarifaHora"
                           step="0.01"
                           min="0"
                           required>
                </div>

                <!-- BOTONES -->
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a th:href="@{/contratos/}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
