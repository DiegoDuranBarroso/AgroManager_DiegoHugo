<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Asignación</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">AgroManager</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-4">Nueva Asignación</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/asignaciones/}" method="post">

                <!-- EMPLEADO -->
                <div class="mb-3">
                    <label class="form-label">Empleado</label>
                    <select class="form-select" name="empleadoId" required>
                        <option th:value="" disabled selected>-- Selecciona un empleado --</option>
                        <option th:each="emp : ${empleados}"
                                th:value="${emp.id}"
                                th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                        </option>
                    </select>
                </div>

                <!-- FINCA -->
                <div class="mb-3">
                    <label class="form-label">Finca</label>
                    <select class="form-select" name="fincaId" required>
                        <option th:value="" disabled selected>-- Selecciona una finca --</option>
                        <option th:each="f : ${fincas}"
                                th:value="${f.id}"
                                th:text="${f.nombre}">
                        </option>
                    </select>
                </div>

                <!-- FECHA INICIO -->
                <div class="mb-3">
                    <label class="form-label">Fecha de inicio</label>
                    <input type="date" class="form-control" name="fechaInicio" required>
                </div>

                <!-- FECHA FIN (opcional) -->
                <div class="mb-3">
                    <label class="form-label">Fecha de fin (opcional)</label>
                    <input type="date" class="form-control" name="fechaFin">
                    <small class="text-muted">Déjalo vacío si la asignación es indefinida.</small>
                </div>

                <!-- BOTONES -->
                <div class="mt-4">
                    <button type="submit" class="btn btn-success">Crear asignación</button>
                    <a th:href="@{/asignaciones/}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
