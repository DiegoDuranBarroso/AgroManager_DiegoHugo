<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Asignación</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">


    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">AgroManager - 👔Gerente</a>

        <span class="navbar-text text-white"
              th:text="'👤 ' + ${gerente.nombre}">
    👤 Nombre gerente
</span>

    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-3">Nueva Asignación</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <!--
                IMPORTANTE:
                Este formulario manda un POST a /asignaciones/
                con parámetros:
                - empleadoId
                - fincaId
                - fechaInicio
                - fechaFin (opcional)
                - horasEstimadas (opcional)
            -->
            <form th:action="@{/asignaciones/}"
                  method="post"
                  class="row g-3">

                <!-- EMPLEADO -->
                <div class="col-md-6">
                    <label class="form-label">Empleado</label>
                    <select class="form-select" name="empleadoId" required>
                        <!-- opción vacía estática (sin th:*) -->
                        <option value="">-- Selecciona empleado --</option>

                        <!-- empleados activos recibidos en el modelo -->
                        <option th:each="emp : ${empleados}"
                                th:value="${emp.id}"
                                th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                        </option>
                    </select>
                </div>

                <!-- FINCA -->
                <div class="col-md-6">
                    <label class="form-label">Finca</label>
                    <select class="form-select" name="fincaId" required>
                        <option value="">-- Selecciona finca --</option>

                        <option th:each="f : ${fincas}"
                                th:value="${f.id}"
                                th:text="${f.nombre}">
                        </option>
                    </select>
                </div>

                <!-- FECHA INICIO -->
                <div class="col-md-4">
                    <label class="form-label">Fecha inicio</label>
                    <input type="date"
                           class="form-control"
                           name="fechaInicio"
                           required>
                </div>

                <!-- FECHA FIN (opcional) -->
                <div class="col-md-4">
                    <label class="form-label">Fecha fin (opcional)</label>
                    <input type="date"
                           class="form-control"
                           name="fechaFin">
                </div>

                <!-- HORAS ESTIMADAS (opcional, por si la usas en la entidad) -->
                <div class="col-md-4">
                    <label class="form-label">Horas estimadas</label>
                    <input type="number"
                           class="form-control"
                           name="horasEstimadas"
                           min="0"
                           step="0.25">
                </div>

                <!-- BOTONES -->
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a th:href="@{/asignaciones/}" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
