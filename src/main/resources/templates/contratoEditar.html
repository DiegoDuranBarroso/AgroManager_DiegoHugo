<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Contrato</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/encabezado.css}">
    <link rel="stylesheet" th:href="@{/css/fondos2.css}">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid d-flex justify-content-between align-items-center">

        <!-- IZQUIERDA: logo + texto (igual que antes) -->
        <a class="navbar-brand d-flex align-items-center brand-box"
           th:href="@{/home}">
            <img th:src="@{/img/favicon.png}" alt="Logo" class="brand-logo">
            <span class="brand-text">AGROMANAGER - 👔 Gerente</span>
        </a>

        <!-- DERECHA: chip de perfil SOLO INFORMATIVO (sin enlace) -->
        <div class="d-flex align-items-center profile-chip">

            <span class="profile-name me-3"
                  th:text="${gerente.nombre}">
                Nombre gerente
            </span>

            <div class="profile-avatar">
                <!-- Si el usuario tiene foto de perfil -->
                <img th:if="${gerente.usuario != null and gerente.usuario.fotoPerfil != null}"
                     th:src="@{|/uploads/${gerente.usuario.fotoPerfil}|}"
                     alt="Foto perfil">

                <!-- Si NO tiene foto, icono por defecto -->
                <i th:if="${gerente.usuario == null or gerente.usuario.fotoPerfil == null}"
                   class="bi bi-person-fill"></i>
            </div>
        </div>

    </div>
</nav>

<!-- === FONDO GLOBAL === -->
<div class="home-wrapper">
    <div class="home-content container">

        <h2 class="fw-bold mb-3 text-dark">Editar Contrato</h2>

        <div class="card shadow-sm">
            <div class="card-body">

                <!-- IMPORTANTE: action apunta a /contratos/{id}/actualizar -->
                <form th:action="@{|/contratos/${contrato.id}/actualizar|}"
                      method="post"
                      class="row g-3">

                    <!-- EMPLEADO -->
                    <div class="col-md-6">
                        <label class="form-label text-dark">Empleado</label>
                        <select class="form-select" name="empleadoId" required>
                            <option value="">-- Selecciona empleado --</option>
                            <option th:each="emp : ${empleados}"
                                    th:value="${emp.id}"
                                    th:selected="${contrato.empleado != null and contrato.empleado.id == emp.id}"
                                    th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                            </option>
                        </select>
                    </div>

                    <!-- TIPO DE CONTRATO -->
                    <div class="col-md-6">
                        <label class="form-label text-dark">Tipo de contrato</label>
                        <select class="form-select" name="tipo" required>
                            <option value="">-- Selecciona tipo --</option>
                            <option th:each="t : ${tiposContrato}"
                                    th:value="${t}"
                                    th:selected="${contrato.tipo != null and contrato.tipo == t}"
                                    th:text="${t}">
                            </option>
                        </select>
                    </div>

                    <!-- FECHA INICIO -->
                    <div class="col-md-4">
                        <label class="form-label text-dark">Fecha inicio</label>
                        <input type="date"
                               class="form-control"
                               name="fechaInicio"
                               th:value="${contrato.fechaInicio}">
                    </div>

                    <!-- FECHA FIN (opcional) -->
                    <div class="col-md-4">
                        <label class="form-label text-dark">Fecha fin (opcional)</label>
                        <input type="date"
                               class="form-control"
                               name="fechaFin"
                               th:value="${contrato.fechaFin}">
                    </div>

                    <!-- SALARIO BASE -->
                    <div class="col-md-4">
                        <label class="form-label text-dark">Salario base</label>
                        <input type="number"
                               class="form-control"
                               name="salarioBase"
                               step="0.01"
                               min="0"
                               th:value="${contrato.salarioBase}">
                    </div>

                    <!-- TARIFA HORA -->
                    <div class="col-md-4">
                        <label class="form-label text-dark">Tarifa hora</label>
                        <input type="number"
                               class="form-control"
                               name="tarifaHora"
                               step="0.01"
                               min="0"
                               th:value="${contrato.tarifaHora}">
                    </div>

                    <!-- BOTONES -->
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-success">Guardar cambios</button>
                        <a th:href="@{/contratos/}" class="btn btn-secondary">Cancelar</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

<footer style="background-color: #1e1e1e; padding: 25px 0;">
    <div class="container text-center text-white">

        <p class="mb-2">
            © 2025 <strong>AgroManager</strong> — Todos los derechos reservados.
        </p>

        <p class="mb-3">
            Contacto:
            <a href="mailto:contacto@agromanager.com"
               style="color: #4caf50; text-decoration: none;">
                contacto@agromanager.com
            </a>
        </p>

        <div class="mb-3">
            <a href="https://facebook.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://twitter.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-twitter-x" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://linkedin.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-linkedin" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://github.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-github" style="font-size: 1.5rem;"></i>
            </a>
        </div>

        <p class="mb-0 text-secondary">
            APP creada por <strong>Diego Durán Barroso</strong> y <strong>Hugo Sánchez de la Roda Rivera</strong>.
        </p>

    </div>
</footer>

</body>
</html>
