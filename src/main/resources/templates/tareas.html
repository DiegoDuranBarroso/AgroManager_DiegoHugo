<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tareas</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/encabezado.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid d-flex justify-content-between align-items-center">

        <!-- Logo + texto dinámico según EMPLEADO o GERENTE -->
        <a class="navbar-brand d-flex align-items-center brand-box"
           th:href="@{/home}">

            <!-- Logo -->
            <img th:src="@{/img/favicon.png}" alt="Logo" class="brand-logo">

            <!-- Texto de la marca como antes -->
            <span class="brand-text"
                  th:text="${modo == 'EMPLEADO'} ?
                           'AGROMANAGER - 🦺 Empleado' :
                           'AGROMANAGER - 👔 Gerente'">
                AgroManager
            </span>
        </a>

        <!-- Nombre del usuario logueado (gerente) -->
        <span class="navbar-text text-white"
              th:if="${gerente != null}"
              th:text="|👤 ${gerente.nombre}|">
            👤 Nombre usuario
        </span>

        <!-- Nombre del usuario logueado (empleado) -->
        <span class="navbar-text text-white"
              th:if="${gerente == null and empleadoSesion != null}"
              th:text="|👤 ${empleadoSesion.nombre}|">
            👤 Nombre usuario
        </span>

    </div>
</nav>



<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Tareas</h2>

        <!-- Botón "Nueva tarea" SOLO para GERENTE -->
        <a class="btn btn-success"
           th:if="${modo == null or modo != 'EMPLEADO'}"
           th:href="@{/tareas/nueva}">
            + Nueva tarea
        </a>
    </div>

    <!-- FILTRO POR EMPLEADO SOLO PARA GERENTE -->
    <div th:if="${modo == null or modo != 'EMPLEADO'}">
        <form class="row g-2 mb-4" th:action="@{/tareas/}" method="get">
            <div class="col-md-4">
                <label class="form-label">Empleado</label>
                <select class="form-select" name="empleadoId">
                    <option value="">-- Todos --</option>
                    <option th:each="emp : ${empleados}"
                            th:value="${emp.id}"
                            th:selected="${empleadoSeleccionado != null and empleadoSeleccionado == emp.id}"
                            th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                    </option>
                </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button type="submit" class="btn btn-outline-success me-2">Filtrar</button>
                <a th:href="@{/tareas/}" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </form>
    </div>

    <!-- TABLA DE TAREAS -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Empleado</th>
                    <th>Finca</th>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Horas</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tareas}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.empleado != null ? t.empleado.nombre : '—'}"></td>
                    <td th:text="${t.finca != null ? t.finca.nombre : '—'}"></td>
                    <td th:text="${t.fecha}"></td>
                    <td th:text="${t.tipo}"></td>
                    <td th:text="${t.horas}"></td>
                    <td>
                        <!-- Botón eliminar SOLO para GERENTE -->
                        <form th:if="${modo == null or modo != 'EMPLEADO'}"
                              th:action="@{|/tareas/${t.id}/eliminar?modo=${modo}&empleadoId=${empleadoSeleccionado}|}"
                              method="post"
                              class="d-inline">
                            <button class="btn btn-sm btn-danger"
                                    onclick="return confirm('¿Eliminar esta tarea?')">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <!-- /home ya decide si mandar a gerenteHome o empleadoHome -->
        <a th:href="@{/home}" class="btn btn-secondary">Volver al inicio</a>
    </div>

</div>

<footer style="background-color: #1e1e1e; padding: 25px 0; margin-top: 40px;">
    <div class="container text-center text-white">

        <p class="mb-2">
            © 2025 <strong>AgroManager</strong> — Todos los derechos reservados.
        </p>

        <p class="mb-3">
            Contacto:
            <a href="mailto:contacto@agromanager.com"
               style="color: #4caf50; text-decoration: none;">
                contacto@agromanager.com
            </a>
        </p>

        <div class="mb-3">
            <a href="https://facebook.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://twitter.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-twitter-x" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://linkedin.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-linkedin" style="font-size: 1.5rem;"></i>
            </a>

            <a href="https://github.com" target="_blank" class="text-white mx-2">
                <i class="bi bi-github" style="font-size: 1.5rem;"></i>
            </a>
        </div>

        <p class="mb-0 text-secondary">
            APP creada por <strong>Diego Durán Barroso</strong>y <strong>Hugo Sánchez de la Roda Rivera</strong>.
        </p>

    </div>
</footer>
</body>
</html>
