<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear tarea (Gerente)</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">AgroManager -👔Gerente</a>

        <span class="navbar-text text-white"
              th:text="'👤 ' + ${gerente.nombre}">
    👤 Nombre gerente
</span>

    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-3">Crear nueva tarea</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/tareas/}" method="post">

                <!-- Selector de empleado -->
                <div class="mb-3">
                    <label class="form-label">Empleado</label>
                    <select class="form-select" name="empleadoId" required>
                        <option value="">-- Selecciona un empleado --</option>
                        <option th:each="emp : ${empleados}"
                                th:value="${emp.id}"
                                th:text="${emp.nombre + ' (' + emp.dni + ')'}">
                        </option>
                    </select>
                </div>

                <!-- Selector de finca -->
                <div class="mb-3">
                    <label class="form-label">Finca</label>
                    <select class="form-select" name="fincaId" required>
                        <option value="">-- Selecciona una finca --</option>
                        <option th:each="f : ${fincas}"
                                th:value="${f.id}"
                                th:text="${f.nombre}">
                        </option>
                    </select>
                </div>

                <!-- Tipo -->
                <div class="mb-3">
                    <label class="form-label">Tipo de tarea</label>
                    <input type="text" class="form-control" name="tipo" required>
                </div>

                <!-- Horas -->
                <div class="mb-3">
                    <label class="form-label">Horas trabajadas</label>
                    <input type="number" class="form-control"
                           name="horas" min="0.25" step="0.25" required>
                </div>

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-success">Guardar tarea</button>
                </div>

            </form>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/tareas/}" class="btn btn-outline-secondary">Volver</a>
    </div>

</div>

</body>
</html>
