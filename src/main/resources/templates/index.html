<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgroManager - Inicio</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f5f5;
        }
        .card-hover:hover {
            transform: scale(1.02);
            transition: 0.2s ease-in-out;
        }
        .main-container {
            margin-top: 60px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <!-- Si hay sesión, /home te lleva al panel según el rol; si no, redirige de vuelta aquí -->
        <a class="navbar-brand" th:href="@{/home}">AgroManager</a>
    </div>
</nav>

<div class="container main-container">

    <h1 class="text-center mb-4 fw-bold">Bienvenido a AgroManager</h1>
    <p class="text-center mb-5">
        Elige si quieres registrarte como gerente o acceder al sistema.
    </p>

    <div class="row g-4 justify-content-center">

        <!-- Registrarse como gerente -->
        <div class="col-md-4">
            <a th:href="@{/registro/gerente}" class="text-decoration-none">
                <div class="card shadow-sm card-hover">
                    <div class="card-body text-center">
                        <h4>Registrarse como gerente</h4>
                        <p class="text-muted mb-0">
                            Crea el primer usuario gerente del sistema.
                        </p>
                    </div>
                </div>
            </a>
        </div>

        <!-- Iniciar sesión (selector de rol en la siguiente pantalla) -->
        <div class="col-md-4">
            <a th:href="@{/login}" class="text-decoration-none">
                <div class="card shadow-sm card-hover">
                    <div class="card-body text-center">
                        <h4>Iniciar sesión</h4>
                        <p class="text-muted mb-0">
                            Accede como gerente o empleado seleccionando tu rol.
                        </p>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>

</body>
</html>
