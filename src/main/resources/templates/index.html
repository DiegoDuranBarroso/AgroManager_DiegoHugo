<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - AgroManager</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Tipografía -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">

    <!-- Tus estilos -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/encabezado.css}">

</head>
<body>

<div class="page-wrapper">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center brand-box"
               th:href="@{/home}">
                <img src="/img/favicon.png" alt="Logo" class="brand-logo">
                <span class="brand-text">AGROMANAGER</span>
            </a>
        </div>
    </nav>

    <!-- ZONA CON IMAGEN DE FONDO + CAPA OSCURA -->
    <div class="login-wrapper">

        <!-- CONTENEDOR LOGIN -->
        <div class="login-container">
            <div class="login-card">
                <div class="login-inner">

                    <!-- LOGO REDONDO -->
                    <div class="login-logo-circle">
                        <div class="login-logo-circle-inner">
                            <img src="/img/favicon.png" alt="Logo hoja" />
                        </div>
                    </div>

                    <h3 class="login-title">LOGIN</h3>
                    <p class="login-subtitle">Inicia sesión para empezar.</p>

                    <!-- ERROR -->
                    <div th:if="${error}" class="alert alert-danger alert-login mt-2">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">

                        <!-- ROL -->
                        <label class="form-label mb-1">Rol</label>
                        <div class="input-icon-wrapper mb-2">
                            <i class="bi bi-person-badge"></i>
                            <select class="form-select" name="rol" required>
                                <option value="GERENTE"
                                        th:selected="${rolSeleccionado == 'GERENTE'}">
                                    Gerente
                                </option>
                                <option value="EMPLEADO"
                                        th:selected="${rolSeleccionado == 'EMPLEADO'}">
                                    Empleado
                                </option>
                            </select>
                        </div>

                        <!-- USERNAME -->
                        <label class="form-label mb-1">Nombre de usuario</label>
                        <div class="input-icon-wrapper mb-2">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control" name="username" required>
                        </div>

                        <!-- PASSWORD -->
                        <label class="form-label mb-1">Contraseña</label>
                        <div class="input-icon-wrapper mb-3">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-control" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-login text-white">
                            LOGIN
                        </button>

                        <div class="login-footer-links mt-3">
                            <a th:href="@{/registro/gerente}">
                                <button type="button" class="btn-secondary-pill">
                                    REGISTRAR GERENTE
                                </button>
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="login-footer">
        <div class="container text-center text-white">

            <p class="mb-2">
                © 2025 <strong>AgroManager</strong> — Todos los derechos reservados.
            </p>

            <p class="mb-3">
                Contacto:
                <a href="mailto:contacto@agromanager.com"
                   style="color: #4caf50; text-decoration: none;">
                    contacto@agromanager.com
                </a>
            </p>

            <div class="mb-3">
                <a href="https://facebook.com" target="_blank" class="text-white mx-2">
                    <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
                </a>
                <a href="https://twitter.com" target="_blank" class="text-white mx-2">
                    <i class="bi bi-twitter-x" style="font-size: 1.5rem;"></i>
                </a>
                <a href="https://instagram.com" target="_blank" class="text-white mx-2">
                    <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
                </a>
                <a href="https://linkedin.com" target="_blank" class="text-white mx-2">
                    <i class="bi bi-linkedin" style="font-size: 1.5rem;"></i>
                </a>
                <a href="https://github.com" target="_blank" class="text-white mx-2">
                    <i class="bi bi-github" style="font-size: 1.5rem;"></i>
                </a>
            </div>

            <p class="mb-0 text-secondary">
                APP creada por <strong>Diego Durán Barroso</strong> y
                <strong>Hugo Sánchez de la Roda Rivera</strong>.
            </p>

        </div>
    </footer>

</div>

<!-- AVISO DE REGISTRO OK + REDIRECCIÓN -->
<div th:if="${registroOK}"
     class="alert alert-success text-center position-fixed top-0 start-50 translate-middle-x mt-3"
     style="z-index: 9999; width: 350px; border-radius: 12px;">
    Gerente registrado correctamente. Redirigiendo...
</div>

<script th:if="${registroOK}">
    setTimeout(() => {
        window.location.href = '/login';
    }, 2000);
</script>

</body>
</html>
