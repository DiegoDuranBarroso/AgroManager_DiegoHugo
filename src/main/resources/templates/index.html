<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgroManager - Iniciar sesión</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f5f5;
        }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">AgroManager</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm login-card">
        <div class="card-body">
            <h3 class="text-center mb-4 fw-bold">Iniciar sesión</h3>

            <!-- Mensaje de error (si lo hay) -->
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">ID de usuario</label>
                    <input type="number" class="form-control" name="usuarioId"
                           placeholder="Ej: 1, 2, 3..."
                           required>
                    <small class="text-muted">
                        Para las pruebas: 1 = gerente1, 2/3/4 = empleados.
                    </small>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-success">Entrar</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
